`],
          ["4. Tercihleriniz ve hukuki dayanaklar", "Yerel oyun verileri oyunu sunmak; ayarlar seçiminizi hatırlamak için işlenir. Uygulanabilir hukuka göre hizmetin sağlanması, güvenlik ve destek için meşru menfaat, yasal yükümlülükler ve gerektiğinde rıza ilgili dayanakları oluşturabilir. Reklamlarla ilgili rıza gerekli olduğunda Google izin formu gösterilir. Bölgeniz ve izin durumunuz gerektirdiğinde Ayarlar → Reklam Gizlilik Seçenekleri üzerinden tercihlerinizi değiştirebilirsiniz. Cihazınızın reklam ve gizlilik ayarlarını da kullanabilirsiniz. Rızanın geri alınması önceki hukuka uygun işlemleri etkilemez; kişiselleştirilmemiş reklamlar da bazı teknik verileri işleyebilir."],
          ["5. Paylaşım, yurt dışı işleme ve güvenlik", "Geliştirici yerel oyuncu listesini veya oyun içi kural metinlerini toplamaz ve satmaz. Reklam verileri Google ve ilgili sağlayıcılara aktarılabilir ve yaşadığınız ülke dışındaki sunucularda işlenebilir. Sağlayıcıların aktarım ve koruma uygulamaları kendi politikalarında açıklanır. Yasal zorunluluklar kapsamında elimizde bulunan bilgiler yetkili mercilerle paylaşılabilir. Cihazınızı ve işletim sisteminizi güncel tutun; hiçbir depolama veya aktarım yöntemi mutlak güvenlik garantisi sunmaz."],
          ["6. Saklama ve silme", "Oyun verileri geçici bellektedir. Dil ve titreşim tercihlerini ayarlardan değiştirebilir, uygulama verilerini silerek veya uygulamayı kaldırarak yerel kayıtları kaldırabilirsiniz; işletim sistemi yedekleri ayrı olarak yönetilir. Reklam ve izin verilerinin saklama süreleri Google’ın amaçları ve politikalarına bağlıdır; geliştirici bunlar için tek bir süre belirleyemez. Destek için e-posta gönderirseniz adresiniz ve mesajınız talebi yanıtlamak için işlenir; talep tamamlandıktan sonra hukuki zorunluluk veya uyuşmazlık için gerekli olmadıkça silinir. Gereksiz kişisel bilgi göndermeyin."],
          ["7. Haklarınız", "Bulunduğunuz yere göre verilerinize erişme, düzeltme, silme, işlemeyi kısıtlama, itiraz, taşınabilirlik, rızayı geri alma ve yetkili veri koruma makamına şikâyet haklarınız olabilir. Türkiye’de KVKK madde 11 kapsamındaki haklarınız saklıdır. Taleplerinizi yukarıdaki iletişim adresine iletin. Cihazda kalan oyun verilerine geliştiricinin erişimi yoktur; Google’ın tuttuğu bilgiler için Google gizlilik araçları veya başvuru kanalları da kullanılabilir."],
          ["8. Yaş sınırı", "DESTE - Party Card Game yetişkinlere (18+) yöneliktir ve çocuklar için tasarlanmamıştır. Geliştirici bilerek çocuklardan kişisel bilgi talep etmez. Bir çocuğun destek kanalıyla bilgi gönderdiğini düşünüyorsanız silme talebi için bizimle iletişime geçin."],
          ["9. Bu web sitesi ve dış bağlantılar", `Bu sayfalar GitHub Pages üzerinde yayımlandığında GitHub, siteyi sunmak ve güvenliğini sağlamak için IP adresi ve istek bilgileri gibi teknik verileri işleyebilir. Bkz. <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub Gizlilik Bildirimi</a>. Bu sayfalara ayrıca analiz, reklam veya çerez betiği eklenmemiştir. Harici bağlantıları açtığınızda ilgili sitenin politikası geçerlidir.`],

      en: {
        heading: "Privacy Policy",
        updated: "Last updated: 18 September 2026",
        notice: "<strong>DRAFT:</strong> Do not publish until the developer and contact details are complete.",
        sections: [
          ["1. Scope and responsible party", `This policy covers DESTE - Party Card Game, a shared-device social card game, and this information website. Developer/data controller: <strong>Mehmet Kaan Yilmam</strong>. Privacy contact: <a href="mailto:studiolabss0@gmail.com">studiolabss@gmail.com</a>`],
          ["2. Information processed on your device", "Player names or nicknames, selected gender, player order, drawn cards and custom game rules are processed in device memory to run the game. The app does not send this information to a developer server or pass it to the advertising SDK. You may use nicknames; avoid entering sensitive information about others. The current version does not persist game sessions; session data is lost when the app process ends. Language and vibration preferences are stored locally until changed or removed."],
          ["3. Advertising and Google services", `Ad-enabled versions use Google AdMob (Google Mobile Ads SDK) and Google User Messaging Platform (UMP) for consent management. Ads are currently enabled in the iOS version and disabled in the Android production version. Advertising services may process IP addresses (which can indicate approximate location), device or advertising identifiers, ad impressions and interactions, app interactions, crash diagnostics and performance information. Google and relevant advertising providers may use these for ad delivery, measurement, analytics, security and fraud prevention. Actual processing depends on your platform, permissions and advertising configuration. UMP manages consent status and choices. See the <a href="https://policies.google.com/privacy">Google Privacy Policy</a> and <a href="https://policies.google.com/technologies/partner-sites">Google’s use of information from partner apps</a>. The iOS version of the app uses live Google AdMob ad units. The Google Mobile Ads SDK may process approximate location inferred from an IP address, device or advertising identifiers, advertisements viewed and advertising interactions, app interactions, crash logs, diagnostic information and performance data. This information may be used for ad delivery and measurement, analytics, security, performance improvement and fraud prevention. The scope of the data processed depends on the user’s region, permissions and consent status, device settings and the app’s advertising configuration. The app’s data-processing practices are disclosed according to its actual production configuration in the App Privacy section of the App Store and, where applicable, the Data safety section of Google Play.
`],
          ["4. Choices and legal bases", "Local game information enables gameplay and settings remember your choices. Depending on applicable law, relevant bases may include providing the service, legitimate interests in security and support, legal obligations and consent where required. A Google consent form is displayed when required. When required for your region and consent status, revisit Settings → Ad Privacy Options to change your choices. You can also use device advertising and privacy settings. Withdrawing consent does not affect earlier lawful processing. Non-personalized ads may still process technical information."],
          ["5. Sharing, international processing and security", "The developer does not collect or sell local player lists or custom rules. Advertising information may be shared with Google and relevant service providers and processed outside your country. Their policies describe applicable transfer safeguards. Information we hold may be disclosed where legally required. Keep your device secure and updated; no storage or transmission method is completely secure."],
          ["6. Retention and deletion", "Game information is held in temporary memory. Change language and vibration preferences in Settings; clear app data or uninstall to remove local records, with operating-system backups managed separately. Google’s purposes and policies govern retention of advertising and consent information; the developer cannot specify a single retention period for it. If you email support, your address and message are used to handle your request and deleted after resolution unless needed for legal obligations or disputes. Do not send unnecessary personal information."],
          ["7. Your rights", "Depending on your location, you may have rights to access, correction, deletion, restriction, objection, portability, withdrawal of consent and complaints to a data protection authority. Rights under Article 11 of Türkiye’s KVKK remain available where applicable. Contact us using the address above. The developer cannot access game information held only on your device. Google’s privacy tools and contact channels may also be used for information Google holds."],
          ["8. Age requirement", "DESTE - Party Card Game is intended for adults aged 18 or over, not children. The developer does not knowingly request personal information from children. Contact us if a child has provided information through support so we can address deletion."],
          ["9. This website and external links", `When these pages are hosted on GitHub Pages, GitHub may process technical information such as IP addresses and request details to deliver and secure the site. See the <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">GitHub Privacy Statement</a>. No additional analytics, advertising or cookie scripts have been added to these pages. External websites have their own policies.`],
          ["10. Changes", "We will update this policy and its date when features or processing practices change. Material changes will be communicated in the app where required, and new consent requested where necessary."]
        ]

      es: {
        heading: "Política de privacidad",
        updated: "Última actualización: 18 de septiembre de 2026",
        notice: "<strong>BORRADOR:</strong> No publique esta política hasta completar los datos del desarrollador y de contacto.",
        sections: [
          ["1. Ámbito de aplicación y responsable", `Esta política se aplica a DESTE - Party Card Game, un juego social de cartas para jugar en un dispositivo compartido, y a este sitio web informativo. Desarrollador/responsable del tratamiento: <strong>Mehmet Kaan Yilmam</strong>. Contacto de privacidad: <a href="mailto:studiolabss@gmail.com">studiolabss@gmail.com</a>`],

          ["3. Publicidad y servicios de Google", `Las versiones con publicidad utilizan Google AdMob (Google Mobile Ads SDK) y Google User Messaging Platform (UMP) para gestionar el consentimiento. Actualmente, los anuncios están habilitados en la versión para iOS y deshabilitados en la versión de producción para Android. Los servicios publicitarios pueden tratar direcciones IP (que pueden indicar una ubicación aproximada), identificadores del dispositivo o publicitarios, impresiones e interacciones con anuncios, interacciones con la aplicación, diagnósticos de fallos e información de rendimiento. Google y los proveedores publicitarios correspondientes pueden utilizar estos datos para mostrar anuncios, realizar mediciones y análisis, garantizar la seguridad y prevenir el fraude. El tratamiento efectivo depende de su plataforma, permisos y configuración publicitaria. UMP gestiona el estado y las opciones de consentimiento. Consulte la <a href="https://policies.google.com/privacy">Política de Privacidad de Google</a> y la información sobre <a href="https://policies.google.com/technologies/partner-sites">cómo utiliza Google los datos de aplicaciones asociadas</a>. La versión para iOS de la aplicación utiliza unidades publicitarias reales de Google AdMob. El SDK de Google Mobile Ads puede tratar la ubicación aproximada obtenida a partir de la dirección IP, identificadores del dispositivo o identificadores publicitarios, anuncios visualizados e interacciones con anuncios, interacciones con la aplicación, registros de fallos, información de diagnóstico y datos de rendimiento. Esta información puede utilizarse para mostrar y medir anuncios, realizar análisis, garantizar la seguridad, mejorar el rendimiento y prevenir el fraude. El alcance de los datos tratados depende de la región del usuario, sus permisos y el estado de su consentimiento, los ajustes del dispositivo y la configuración publicitaria de la aplicación. Las prácticas de tratamiento de datos de la aplicación se declaran según su configuración real de producción en la sección Privacidad de la app de App Store y, cuando corresponda, en la sección Seguridad de los datos de Google Play.
`],
          ["4. Sus opciones y bases jurídicas", "La información local del juego permite su funcionamiento y los ajustes recuerdan sus elecciones. Según la legislación aplicable, las bases jurídicas pueden incluir la prestación del servicio, los intereses legítimos relacionados con la seguridad y la asistencia, las obligaciones legales y el consentimiento cuando sea necesario. Cuando se requiera consentimiento para la publicidad, se mostrará un formulario de Google. Cuando su región y el estado de su consentimiento lo requieran, puede cambiar sus opciones en Ajustes → Opciones de privacidad de anuncios. También puede utilizar los ajustes de publicidad y privacidad del dispositivo. La retirada del consentimiento no afecta al tratamiento lícito realizado anteriormente. Los anuncios no personalizados también pueden tratar determinada información técnica."],
          ["5. Comunicación, tratamiento internacional y seguridad", "El desarrollador no recopila ni vende las listas locales de jugadores ni las reglas personalizadas. La información publicitaria puede compartirse con Google y los proveedores de servicios correspondientes, y tratarse fuera de su país. Sus políticas describen las garantías aplicables a las transferencias. La información que obre en nuestro poder podrá comunicarse cuando exista una obligación legal. Mantenga su dispositivo protegido y actualizado; ningún método de almacenamiento o transmisión es completamente seguro."],
          ["6. Conservación y eliminación", "La información del juego se mantiene en memoria temporal. Puede cambiar las preferencias de idioma y vibración en Ajustes; borre los datos de la aplicación o desinstálela para eliminar los registros locales. Las copias de seguridad del sistema operativo se gestionan por separado. Los fines y políticas de Google determinan el plazo de conservación de la información publicitaria y de consentimiento; el desarrollador no puede establecer un único plazo. Si envía un correo electrónico al servicio de asistencia, su dirección y mensaje se utilizarán para atender su solicitud y se eliminarán una vez resuelta, salvo que sean necesarios para cumplir obligaciones legales o resolver disputas. No envíe información personal innecesaria."],
          ["7. Sus derechos", "Dependiendo de su ubicación, puede tener derechos de acceso, rectificación, supresión, limitación, oposición, portabilidad, retirada del consentimiento y reclamación ante una autoridad de protección de datos. Los derechos previstos en el artículo 11 de la KVKK de Türkiye seguirán disponibles cuando corresponda. Póngase en contacto con nosotros mediante la dirección indicada anteriormente. El desarrollador no puede acceder a la información del juego almacenada únicamente en su dispositivo. Para la información que conserva Google, también puede utilizar sus herramientas de privacidad y canales de contacto."],
          ["8. Requisito de edad", "DESTE - Party Card Game está destinado a adultos de 18 años o más y no a menores. El desarrollador no solicita conscientemente información personal de menores. Póngase en contacto con nosotros si un menor ha facilitado información a través del servicio de asistencia para que podamos tramitar su eliminación."],
          ["9. Este sitio web y los enlaces externos", `Cuando estas páginas se alojan en GitHub Pages, GitHub puede tratar información técnica, como direcciones IP y datos de las solicitudes, para prestar y proteger el sitio. Consulte la <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">Declaración de Privacidad de GitHub</a>. No se han añadido a estas páginas otros scripts de análisis, publicidad o cookies. Los sitios web externos tienen sus propias políticas.`],
          ["10. Cambios", "Actualizaremos esta política y su fecha cuando cambien las funciones o las prácticas de tratamiento. Los cambios sustanciales se comunicarán en la aplicación cuando sea necesario y se solicitará un nuevo consentimiento cuando corresponda."]
        ]
      },
      de: {
        heading: "Datenschutzerklärung",
        updated: "Letzte Aktualisierung: 18. September 2026",
        notice: "<strong>ENTWURF:</strong> Nicht veröffentlichen, bevor die Entwickler- und Kontaktdaten vollständig sind.",
        sections: [
          ["1. Geltungsbereich und Verantwortlicher", `Diese Datenschutzerklärung gilt für DESTE - Party Card Game, ein soziales Kartenspiel, das gemeinsam auf einem Gerät gespielt wird, sowie für diese Informationswebsite. Entwickler/Verantwortlicher: <strong>Mehmet Kaan Yilmam</strong>. Datenschutzkontakt: <a href="mailto:studiolabss@gmail.com">studiolabss@gmail.com</a>`],
          ["2. Auf Ihrem Gerät verarbeitete Informationen", "Spielernamen oder Spitznamen, das ausgewählte Geschlecht, die Spielerreihenfolge, gezogene Karten und benutzerdefinierte Spielregeln werden im Gerätespeicher verarbeitet, um das Spiel auszuführen. Die App sendet diese Informationen weder an einen Server des Entwicklers noch übermittelt sie sie an das Werbe-SDK. Sie können Spitznamen verwenden; geben Sie keine sensiblen Informationen über andere Personen ein. Die aktuelle Version speichert Spielsitzungen nicht dauerhaft; die Sitzungsdaten gehen verloren, wenn der App-Prozess beendet wird. Sprach- und Vibrationseinstellungen werden lokal gespeichert, bis sie geändert oder entfernt werden."],
          ["3. Werbung und Google-Dienste", `Versionen mit aktivierter Werbung verwenden Google AdMob (Google Mobile Ads SDK) und die Google User Messaging Platform (UMP) zur Einwilligungsverwaltung. In der aktuellen iOS-Version ist Werbung aktiviert; in der Android-Produktionsversion ist sie derzeit deaktiviert. Werbedienste können IP-Adressen (aus denen ein ungefährer Standort abgeleitet werden kann), Geräte- oder Werbekennungen, Anzeigenaufrufe und -interaktionen, App-Interaktionen, Absturzdiagnosen und Leistungsinformationen verarbeiten. Google und die jeweiligen Werbedienstleister können diese Daten zur Anzeigenauslieferung, Messung, Analyse, Sicherheit und Betrugsprävention verwenden. Die tatsächliche Verarbeitung hängt von Ihrer Plattform, Ihren Berechtigungen und der Werbekonfiguration ab. UMP verwaltet den Einwilligungsstatus und Ihre Auswahl. Weitere Informationen finden Sie in der <a href="https://policies.google.com/privacy">Datenschutzerklärung von Google</a> und unter <a href="https://policies.google.com/technologies/partner-sites">Datennutzung durch Google bei Apps von Partnern</a>. In der iOS-Version der App werden echte Google-AdMob-Anzeigenblöcke verwendet. Das Google Mobile Ads SDK kann den anhand der IP-Adresse abgeleiteten ungefähren Standort, Geräte- oder Werbekennungen, angezeigte Werbung und Interaktionen mit Werbung, App-Interaktionen, Absturzprotokolle, Diagnoseinformationen und Leistungsdaten verarbeiten. Diese Informationen können zur Auslieferung und Messung von Werbung, für Analysen, zur Sicherheit, zur Leistungsverbesserung und zur Betrugsprävention verwendet werden. Der Umfang der verarbeiteten Daten hängt von der Region des Nutzers, den erteilten Berechtigungen und dem Einwilligungsstatus, den Geräteeinstellungen sowie der Werbekonfiguration der App ab. Die Datenverarbeitungspraktiken der App werden entsprechend der tatsächlichen Produktionskonfiguration in den Angaben zum App-Datenschutz im App Store und, soweit zutreffend, im Abschnitt zur Datensicherheit bei Google Play offengelegt.
`],
          ["4. Ihre Wahlmöglichkeiten und Rechtsgrundlagen", "Lokale Spielinformationen ermöglichen den Spielbetrieb, und Einstellungen speichern Ihre Auswahl. Je nach anwendbarem Recht können die Bereitstellung des Dienstes, berechtigte Interessen an Sicherheit und Support, rechtliche Verpflichtungen sowie – soweit erforderlich – Ihre Einwilligung als Rechtsgrundlagen dienen. Wenn für Werbung eine Einwilligung erforderlich ist, wird ein Einwilligungsformular von Google angezeigt. Soweit es aufgrund Ihrer Region und Ihres Einwilligungsstatus erforderlich ist, können Sie Ihre Auswahl unter Einstellungen → Datenschutzoptionen für Anzeigen ändern. Sie können außerdem die Werbe- und Datenschutzeinstellungen Ihres Geräts verwenden. Der Widerruf einer Einwilligung berührt nicht die Rechtmäßigkeit der zuvor erfolgten Verarbeitung. Auch nicht personalisierte Werbung kann bestimmte technische Informationen verarbeiten."],
          ["5. Weitergabe, internationale Verarbeitung und Sicherheit", "Der Entwickler erhebt oder verkauft weder lokale Spielerlisten noch benutzerdefinierte Regeln. Werbeinformationen können an Google und die jeweiligen Dienstleister weitergegeben und außerhalb Ihres Landes verarbeitet werden. Die Richtlinien dieser Anbieter beschreiben die geltenden Schutzmaßnahmen für Datenübermittlungen. Informationen, die uns vorliegen, können offengelegt werden, wenn wir gesetzlich dazu verpflichtet sind. Halten Sie Ihr Gerät sicher und auf dem neuesten Stand; keine Speicher- oder Übertragungsmethode ist vollständig sicher."],
          ["6. Speicherung und Löschung", "Spielinformationen werden im temporären Speicher gehalten. Sie können Sprach- und Vibrationseinstellungen in den Einstellungen ändern; löschen Sie die App-Daten oder deinstallieren Sie die App, um lokale Datensätze zu entfernen. Betriebssystem-Sicherungen werden separat verwaltet. Die Zwecke und Richtlinien von Google bestimmen die Speicherdauer von Werbe- und Einwilligungsinformationen; der Entwickler kann hierfür keine einheitliche Speicherdauer festlegen. Wenn Sie dem Support eine E-Mail senden, werden Ihre Adresse und Ihre Nachricht zur Bearbeitung Ihrer Anfrage verwendet und nach deren Abschluss gelöscht, sofern sie nicht zur Erfüllung rechtlicher Verpflichtungen oder zur Beilegung von Streitigkeiten benötigt werden. Senden Sie keine unnötigen personenbezogenen Informationen."],
          ["7. Ihre Rechte", "Je nach Ihrem Standort können Sie Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch, Datenübertragbarkeit, Widerruf Ihrer Einwilligung und Beschwerde bei einer Datenschutzaufsichtsbehörde haben. Rechte gemäß Artikel 11 des türkischen Datenschutzgesetzes KVKK bleiben anwendbar, soweit dies einschlägig ist. Kontaktieren Sie uns über die oben angegebene Adresse. Der Entwickler kann nicht auf Spielinformationen zugreifen, die sich ausschließlich auf Ihrem Gerät befinden. Für von Google gespeicherte Informationen können Sie außerdem die Datenschutztools und Kontaktmöglichkeiten von Google nutzen."],
          ["8. Altersanforderung", "DESTE - Party Card Game richtet sich an Erwachsene ab 18 Jahren und nicht an Kinder. Der Entwickler fordert wissentlich keine personenbezogenen Informationen von Kindern an. Kontaktieren Sie uns, wenn ein Kind über den Support Informationen übermittelt hat, damit wir deren Löschung veranlassen können."],
          ["9. Diese Website und externe Links", `Wenn diese Seiten über GitHub Pages gehostet werden, kann GitHub technische Informationen wie IP-Adressen und Anfragedaten verarbeiten, um die Website bereitzustellen und abzusichern. Weitere Informationen finden Sie in der <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">Datenschutzerklärung von GitHub</a>. Diesen Seiten wurden keine zusätzlichen Analyse-, Werbe- oder Cookie-Skripte hinzugefügt. Für externe Websites gelten deren eigene Richtlinien.`],
          ["10. Änderungen", "Wir aktualisieren diese Datenschutzerklärung und ihr Datum, wenn sich Funktionen oder Verarbeitungspraktiken ändern. Wesentliche Änderungen werden, soweit erforderlich, in der App mitgeteilt; falls erforderlich, wird eine neue Einwilligung eingeholt."]
        ]
      },
      pl: {
        heading: "Polityka prywatności",
        updated: "Ostatnia aktualizacja: 18 września 2026 r.",
        notice: "<strong>WERSJA ROBOCZA:</strong> Nie publikuj przed uzupełnieniem danych dewelopera i danych kontaktowych.",
        sections: [
          ["1. Zakres i administrator danych", `Niniejsza polityka dotyczy DESTE - Party Card Game, społecznościowej gry karcianej rozgrywanej wspólnie na jednym urządzeniu, oraz tej witryny informacyjnej. Deweloper/administrator danych: <strong>KAAN</strong>. Kontakt w sprawach prywatności: <a href="mailto:studiolabss@gmail.com">studiolabss@gmail.com</a>`],
          ["2. Informacje przetwarzane na urządzeniu", "Imiona lub pseudonimy graczy, wybrana płeć, kolejność graczy, wylosowane karty oraz własne zasady gry są przetwarzane w pamięci urządzenia w celu działania gry. Aplikacja nie wysyła tych informacji na serwer dewelopera ani nie przekazuje ich do reklamowego zestawu SDK. Możesz używać pseudonimów; nie wprowadzaj poufnych informacji o innych osobach. Obecna wersja nie zapisuje sesji gry na stałe; dane sesji zostają utracone po zakończeniu procesu aplikacji. Preferencje języka i wibracji są przechowywane lokalnie do czasu ich zmiany lub usunięcia."],
          ["3. Reklamy i usługi Google", `Wersje z włączonymi reklamami korzystają z Google AdMob (Google Mobile Ads SDK) oraz Google User Messaging Platform (UMP) do zarządzania zgodami. Reklamy są obecnie włączone w wersji na iOS i wyłączone w produkcyjnej wersji na Androida. Usługi reklamowe mogą przetwarzać adresy IP (na podstawie których można określić przybliżoną lokalizację), identyfikatory urządzenia lub identyfikatory reklamowe, wyświetlenia reklam i interakcje z nimi, interakcje z aplikacją, diagnostykę awarii oraz informacje o wydajności. Google i odpowiedni dostawcy reklam mogą wykorzystywać te dane do wyświetlania reklam, pomiarów, analiz, zapewnienia bezpieczeństwa i zapobiegania oszustwom. Rzeczywisty zakres przetwarzania zależy od platformy, udzielonych uprawnień i konfiguracji reklam. UMP zarządza stanem zgody i dokonanymi wyborami. Zobacz <a href="https://policies.google.com/privacy">Politykę prywatności Google</a> oraz informacje o <a href="https://policies.google.com/technologies/partner-sites">wykorzystywaniu przez Google danych z aplikacji partnerów</a>. Wersja aplikacji na iOS korzysta z rzeczywistych jednostek reklamowych Google AdMob. Zestaw Google Mobile Ads SDK może przetwarzać przybliżoną lokalizację ustaloną na podstawie adresu IP, identyfikatory urządzenia lub identyfikatory reklamowe, informacje o wyświetlonych reklamach i interakcjach z reklamami, interakcje z aplikacją, dzienniki awarii, informacje diagnostyczne oraz dane dotyczące wydajności. Informacje te mogą być wykorzystywane do wyświetlania i pomiaru reklam, analiz, zapewniania bezpieczeństwa, poprawy wydajności oraz zapobiegania oszustwom. Zakres przetwarzanych danych zależy od regionu użytkownika, udzielonych uprawnień i stanu zgody, ustawień urządzenia oraz konfiguracji reklam w aplikacji. Praktyki aplikacji dotyczące przetwarzania danych są ujawniane zgodnie z rzeczywistą konfiguracją produkcyjną w sekcji Prywatność aplikacji w App Store oraz, w stosownych przypadkach, w sekcji Bezpieczeństwo danych w Google Play.
`],
          ["4. Twoje wybory i podstawy prawne", "Lokalne informacje o grze umożliwiają rozgrywkę, a ustawienia zapamiętują dokonane wybory. W zależności od obowiązującego prawa podstawą przetwarzania może być świadczenie usługi, uzasadniony interes związany z bezpieczeństwem i wsparciem, obowiązki prawne oraz, gdy jest wymagana, zgoda. Gdy zgoda na reklamy jest wymagana, wyświetlany jest formularz zgody Google. Jeżeli wymaga tego region i stan zgody, możesz zmienić swoje wybory w Ustawienia → Opcje prywatności reklam. Możesz również użyć ustawień reklam i prywatności urządzenia. Wycofanie zgody nie wpływa na zgodność z prawem wcześniejszego przetwarzania. Reklamy niespersonalizowane także mogą przetwarzać niektóre informacje techniczne."],
          ["5. Udostępnianie, przetwarzanie międzynarodowe i bezpieczeństwo", "Deweloper nie zbiera ani nie sprzedaje lokalnych list graczy ani własnych zasad gry. Informacje reklamowe mogą być udostępniane Google i odpowiednim usługodawcom oraz przetwarzane poza Twoim krajem. Zasady tych dostawców opisują stosowane zabezpieczenia transferu danych. Informacje znajdujące się w naszym posiadaniu mogą zostać ujawnione, gdy wymaga tego prawo. Dbaj o bezpieczeństwo i aktualność urządzenia; żadna metoda przechowywania ani przesyłania danych nie jest całkowicie bezpieczna."],
          ["6. Przechowywanie i usuwanie", "Informacje o grze są przechowywane w pamięci tymczasowej. Preferencje języka i wibracji możesz zmienić w Ustawieniach; aby usunąć lokalne dane, wyczyść dane aplikacji lub odinstaluj aplikację. Kopie zapasowe systemu operacyjnego są zarządzane oddzielnie. Cele i zasady Google określają okres przechowywania informacji reklamowych i danych dotyczących zgody; deweloper nie może wskazać dla nich jednego okresu. Jeśli wyślesz wiadomość e-mail do działu pomocy, Twój adres i treść wiadomości zostaną wykorzystane do obsługi zgłoszenia i usunięte po jego rozwiązaniu, chyba że będą potrzebne do spełnienia obowiązków prawnych lub rozstrzygnięcia sporów. Nie przesyłaj niepotrzebnych danych osobowych."],
          ["7. Twoje prawa", "W zależności od miejsca zamieszkania możesz mieć prawo dostępu do danych, ich sprostowania, usunięcia, ograniczenia przetwarzania, wniesienia sprzeciwu, przenoszenia danych, wycofania zgody oraz złożenia skargi do organu ochrony danych. Prawa wynikające z art. 11 tureckiej ustawy KVKK pozostają dostępne w stosownych przypadkach. Skontaktuj się z nami, korzystając z powyższego adresu. Deweloper nie ma dostępu do informacji o grze przechowywanych wyłącznie na Twoim urządzeniu. W odniesieniu do informacji przechowywanych przez Google można również korzystać z narzędzi prywatności i kanałów kontaktowych Google."],
          ["8. Wymóg wieku", "DESTE - Party Card Game jest przeznaczona dla osób dorosłych w wieku co najmniej 18 lat, a nie dla dzieci. Deweloper nie prosi świadomie dzieci o podawanie danych osobowych. Skontaktuj się z nami, jeśli dziecko przekazało informacje za pośrednictwem pomocy technicznej, abyśmy mogli zająć się ich usunięciem."],
          ["9. Ta witryna i łącza zewnętrzne", `Gdy strony te są hostowane w usłudze GitHub Pages, GitHub może przetwarzać informacje techniczne, takie jak adresy IP i szczegóły żądań, w celu udostępniania i zabezpieczenia witryny. Zobacz <a href="https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement">Oświadczenie o prywatności GitHub</a>. Do tych stron nie dodano żadnych dodatkowych skryptów analitycznych, reklamowych ani skryptów plików cookie. Zewnętrzne witryny mają własne polityki.`],
          ["10. Zmiany", "Zaktualizujemy niniejszą politykę i jej datę, gdy zmienią się funkcje lub praktyki przetwarzania. Istotne zmiany zostaną w razie potrzeby zakomunikowane w aplikacji, a tam, gdzie będzie to konieczne, poprosimy o ponowną zgodę."]
        ]
      }
    };

    const content = document.querySelector("#content");
    const buttons = document.querySelectorAll("[data-lang]");
    const supported = Object.keys(policies);

    function render(language, updateHash = true) {
      const lang = supported.includes(language) ? language : "tr";
      const policy = policies[lang];
      document.documentElement.lang = lang;
      content.setAttribute("lang", lang);
      content.innerHTML = `<p class="notice">${policy.notice}</p><h1>${policy.heading}</h1><p>${policy.updated}</p>` +
        policy.sections.map(([title, body]) => `<section><h2>${title}</h2><p>${body}</p></section>`).join("");
      buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === lang)));
      if (updateHash) history.replaceState(null, "", `#${lang}`);
    }

    buttons.forEach(button => button.addEventListener("click", () => render(button.dataset.lang)));
    const hashLang = location.hash.slice(1).toLowerCase();
    const browserLang = navigator.language.slice(0, 2).toLowerCase();
    render(supported.includes(hashLang) ? hashLang : (supported.includes(browserLang) ? browserLang : "tr"), false);
  </script>
