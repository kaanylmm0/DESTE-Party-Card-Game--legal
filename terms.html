          ["6. Prywatność i informacje o sesji", `Informacje o przetwarzaniu danych znajdują się w <a href="privacy.html#pl">Polityce prywatności</a>. Akceptacja niniejszych warunków sama w sobie nie oznacza zgody na przetwarzanie danych w celach reklamowych. Obecna wersja nie zapisuje postępów gry na stałe; postępy i wprowadzone informacje mogą zostać utracone po zakończeniu procesu aplikacji.`],
          ["7. Dostępność i odpowiedzialność", "Podejmujemy uzasadnione starania, aby zapewnić działanie aplikacji, ale nie gwarantujemy nieprzerwanego ani bezbłędnego funkcjonowania. Aktualizacje mogą zmieniać dostępne funkcje. W zakresie dozwolonym przez prawo aplikacja jest udostępniana w miarę dostępności. Niniejsze warunki nie wyłączają bezwzględnie obowiązujących praw konsumenta ani odpowiedzialności, której zgodnie z prawem nie można ograniczyć, w szczególności za działanie umyślne, rażące niedbalstwo lub szkody na osobie, gdy właściwe prawo przewiduje taką odpowiedzialność."],
          ["8. Zaprzestanie korzystania, zmiany i spory", "Możesz w każdej chwili przestać korzystać z aplikacji i ją odinstalować. Po zmianie warunków zaktualizowany tekst i data zostaną opublikowane w tym miejscu; istotne zmiany zostaną w razie potrzeby ogłoszone w aplikacji. Bezwzględnie obowiązujące prawo i ochrona konsumentów pozostają nienaruszone. Niniejsze warunki nie ograniczają ustawowego prawa do zwrócenia się do właściwego sądu lub organu. W przypadku pytań i skarg skorzystaj z powyższego adresu kontaktowego."],
          ["9. Warunki sklepu", `Zastosowanie mają również odpowiednie warunki sklepu, z którego pobrano aplikację. W przypadku aplikacji pobranych z Apple App Store obowiązuje <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Standardowa umowa licencyjna Apple z użytkownikiem końcowym</a>, chyba że określono odrębną licencję niestandardową. Niniejszy dokument nie został oznaczony jako niestandardowa umowa EULA przesłana firmie Apple.`]

    };

    const content = document.querySelector("#content");
    const buttons = document.querySelectorAll("[data-lang]");
    const supported = Object.keys(terms);

    function render(language, updateHash = true) {
      const lang = supported.includes(language) ? language : "tr";
      const documentTerms = terms[lang];
      document.documentElement.lang = lang;
      content.setAttribute("lang", lang);
      content.innerHTML = `<p class="notice">${documentTerms.notice}</p><h1>${documentTerms.heading}</h1><p>${documentTerms.updated}</p>` +
        documentTerms.sections.map(([title, body]) => `<section><h2>${title}</h2><p>${body}</p></section>`).join("");
      buttons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.lang === lang)));
      if (updateHash) history.replaceState(null, "", `#${lang}`);
    }

    buttons.forEach(button => button.addEventListener("click", () => render(button.dataset.lang)));
    const hashLang = location.hash.slice(1).toLowerCase();
    const browserLang = navigator.language.slice(0, 2).toLowerCase();
    render(supported.includes(hashLang) ? hashLang : (supported.includes(browserLang) ? browserLang : "tr"), false);
  </script>
